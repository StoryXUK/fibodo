<main id="main">
<section class="wrap page-hero">
  <p class="eyebrow">Contact</p>
  <h1>Let’s talk.</h1>
  <p class="intro">Tell us about your business and we’ll help you find the right approach — or book a tailored demo.</p>
</section>
<section class="wrap block two" style="align-items:start">
  <div>
    <div class="cards two-up" style="grid-template-columns:1fr">
      <article class="card" style="min-height:0"><span class="num">PHONE</span><h3><a href="tel:+442070430043">+44 (0) 207 043 0043</a></h3></article>
      <article class="card" style="min-height:0"><span class="num">EMAIL</span><h3><a href="mailto:contact@fibodo.com">contact@fibodo.com</a></h3></article>
      <article class="card" style="min-height:0"><span class="num">OFFICE</span><h3>fibodo Limited</h3><p>3rd Floor, 207 Regent Street, London, England, W1B 3HH</p></article>
    </div>
  </div>
  <form class="form" action="mailto:contact@fibodo.com" method="post" enctype="text/plain">
    <h2 style="font-size:2rem">Send a message</h2>
    <label>Enquiry type<select name="enquiry_type"><option>Book a demo</option><option>Operator enquiry</option><option>Partner enquiry</option><option>Public sector enquiry</option><option>General enquiry</option></select></label>
    <label>First name<input name="first_name" required autocomplete="given-name"></label>
    <label>Last name<input name="last_name" required autocomplete="family-name"></label>
    <label>Email<input type="email" name="email" required autocomplete="email"></label>
    <label>Phone<input type="tel" name="phone" autocomplete="tel"></label>
    <label>Your message<textarea name="message"></textarea></label>
    <button class="btn" type="submit">Send message</button>
  </form>
</section>
