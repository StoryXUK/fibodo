<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111c34">
  <title>Prize draw</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #111c34; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #17233c;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at 15% 12%, #254e80 0, transparent 38%),
                  radial-gradient(circle at 90% 85%, #1b5267 0, transparent 35%),
                  #111c34;
    }
    main {
      position: relative;
      width: min(100%, 760px);
      overflow: hidden;
      padding: clamp(36px, 8vw, 88px);
      border: 1px solid rgba(255, 255, 255, .75);
      border-radius: clamp(22px, 5vw, 36px);
      background: #f9fbff;
      box-shadow: 0 28px 80px rgba(0, 0, 0, .22);
    }
    main::before {
      content: "";
      display: block;
      width: 52px;
      height: 6px;
      margin-bottom: clamp(28px, 6vw, 48px);
      border-radius: 999px;
      background: #0876d9;
    }
    main::after {
      content: "";
      position: absolute;
      right: -72px;
      bottom: -100px;
      width: 220px;
      height: 220px;
      border: 30px solid #e6f1fc;
      border-radius: 50%;
      pointer-events: none;
    }
    h1 {
      position: relative;
      z-index: 1;
      max-width: 17ch;
      margin: 0;
      font-size: clamp(2rem, 5.2vw, 3.75rem);
      font-weight: 700;
      letter-spacing: -.035em;
      line-height: 1.14;
      overflow-wrap: break-word;
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      main { min-height: 320px; display: flex; flex-direction: column; justify-content: center; }
      main::after { width: 150px; height: 150px; right: -55px; bottom: -78px; border-width: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Please enter at each stand, the most entries are entered into the prize draw</h1>
  </main>
</body>
</html>
